# Personal / non-fleet ssh entries.
#
# Included FIRST by the home-manager-generated ~/.ssh/config
# (programs.ssh.includes = [ "config.d/*.conf" ]), and ssh is first-match-wins per
# keyword — so anything here OVERRIDES the generated fleet defaults. Edit freely, no
# rebuild required: ~/.ssh/config.d/personal.conf is a symlink straight to this file.
#
# Fleet hosts (dbldframe, hq-gpu-*, ome-*, mac-mini, dblds-air, ...) are GENERATED from
# nix-config/hosts/ — do not add them here, they arrive automatically.

Host bastion
    User ec2-user
    Hostname bastion.domain.com
    IdentityFile ~/.ssh/id_rsa
